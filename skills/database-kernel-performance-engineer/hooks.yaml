before_code_generation:
  - name: load_repo_performance_reference
    instruction: >
      在做 RMDB 性能分析前，先读 references/rmdb_performance_map.md 获取全局性能地图，
      再按瓶颈类型继续读 flush_contention_hotspots 或 executor_optimizer_perf_notes，
      确认 profiling 路径、刷盘点、索引扫描语义和热点解释规则。
  - name: prefer_reproducible_profile_workflow
    instruction: >
      如果用户要求分析 RMDB 在 TPC-C 路径上的性能，优先复用固定 profiling 流程：优先抓服务端，
      perf 不可用时切换到 gprofng，并将初始化阶段与 benchmark-only 阶段分开。
  - name: analyze_hot_path
    instruction: >
      先分析热点路径、内存布局、访问模式、查询计划，再生成代码。
  - name: classify_bottleneck
    instruction: >
      先判断瓶颈属于 CPU、内存、锁、IO、查询计划中的哪一类；若有多类因素，说明主次关系。
  - name: separate_fact_from_inference
    instruction: >
      先区分代码中已确认的事实与尚未测量的推断，不得把推断表述成已证实结论。
  - name: require_structure_level_advice
    instruction: >
      禁止只给抽象建议；优化建议必须落到代码结构、数据结构、执行路径或计划生成逻辑。
  - name: require_workload_awareness
    instruction: >
      先判断目标更偏吞吐、延迟、并发还是 IO 优化，并结合 workload 说明优化适用场景。
  - name: no_claim_without_evidence
    instruction: >
      如果没有性能证据，禁止直接宣称优化有效；必须给出验证方法与预期收益机制。
  - name: capture_new_performance_facts
    instruction: >
      如果本次阅读、profile 或实现发现 skill 尚未记录的新热点、新刷盘点、新 contention 点、
      新 workload 约束或新执行器行为，必须在结束前补进对应 performance reference。

before_final_response:
  - name: maintain_performance_skill_reference
    instruction: >
      如果本次修改改变了 RMDB 的 profiling 工作流、parser 并发模型、benchmark 语义、
      index scan 语义、事务冲突解释、刷盘策略、聚合/分组物化方式或其他性能相关结构，
      必须先更新 skill 中对应的性能参考内容。
  - name: retire_or_explain_old_perf_paths
    instruction: >
      如果本次性能优化替换了旧热点路径、旧冲突处理逻辑或旧 fast path，
      必须同步删除、收缩或明确注释旧实现，避免新旧行为同时生效、互相干扰或污染后续判断。
  - name: remove_stale_performance_facts
    instruction: >
      如果本次任务确认某个性能解释、热点归因、优化路径、历史实验或 benchmark 假设已经不成立，
      必须同步删除或改写 skill 中对应内容，避免留下过期结论。
  - name: explain_why_faster
    instruction: >
      检查是否解释了为什么更快，必须落到算法、内存、cache、拷贝、锁、IO 或计划质量层面。
  - name: ensure_validation_plan
    instruction: >
      检查是否给出了验证方法，包括指标、对照方式或可执行测试路径。
  - name: ensure_risk_and_workload
    instruction: >
      检查是否说明了副作用、回归风险、适用负载，以及在哪些场景下优化可能无效或更慢。
