before_code_generation:
  - name: load_repo_structure_reference
    instruction: >
      在做 RMDB 内核修改前，先读 references/rmdb_project_map.md 获取全局地图，
      再按任务需要继续读 storage_system_record、execution_optimizer_aggregation、index_btree、
      transaction_recovery 中对应的详细 reference，不能只停留在概览层。
  - name: analyze_architecture_layers
    instruction: >
      必须先分析本次需求落在 storage、record、index、execution、transaction、recovery 中的哪一层，
      并说明与相邻层的接口边界。
  - name: analyze_storage_buffer_index_chain
    instruction: >
      必须先分析 storage / buffer / record / index 的关系，确认 page 从何处分配、通过何种 handle 获取、
      如何 pin/unpin、何时标脏、何时保持元数据一致，再生成代码。
  - name: verify_page_based_design
    instruction: >
      必须检查新增或修改的核心持久化状态是否仍然落在 page 上；若依赖 STL 容器，只能用于非持久化辅助逻辑，
      禁止替代 page 内核心数据布局。
  - name: verify_existing_abstractions
    instruction: >
      必须确认实现不会绕过 BufferPoolManager、RmFileHandle、IxIndexHandle、SmManager 等现有抽象层。
  - name: verify_write_path_side_effects
    instruction: >
      如果改动涉及插入、删除、更新、索引维护或元数据更新，必须先检查事务写集、WAL、commit/abort、
      恢复一致性和索引同步影响。
  - name: enforce_mvp_scope
    instruction: >
      必须检查方案是否是最小可实现版本；若一次改动跨越多个子系统或包含未来功能，必须收缩范围后再生成代码。
  - name: capture_new_repo_facts
    instruction: >
      如果在阅读或实现过程中发现 skill 尚未记录、但会影响后续实现判断的新函数、新结构、新刷盘点、
      新调用链或新 benchmark 假设，必须记下并在本次任务结束前补进对应 reference。

before_final_response:
  - name: maintain_kernel_skill_reference
    instruction: >
      如果本次改动涉及 RMDB 的结构性变化，例如模块边界、调用链、页/文件头布局、事务语义、
      执行器构建流程、聚合实现、B+ 树维护逻辑、刷盘路径或 TPCC 相关核心架构假设，
      必须先更新 skill 中对应的参考文档与约束，再结束任务。
  - name: retire_or_explain_old_paths
    instruction: >
      如果本次任务添加、重写或替换了某条主路径功能，必须同步处理旧实现：
      删除已失效逻辑，或明确收缩其生效范围，或写清保留原因；
      不允许留下语义冲突的双主路径实现。
  - name: remove_stale_skill_facts
    instruction: >
      如果本次任务确认某个函数、结构、路径、优化逻辑或 benchmark 假设已删除、失效或不再可信，
      必须同步删除或改写 skill 中对应内容，避免保留幻觉信息。
